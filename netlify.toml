[build]
  publish = "."

[build.environment]
  # @netlify/blobs (shared favourites) needs Node 22.12 or newer
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Always fetch the newest planner after a deploy (no stale copy from the browser cache)
[[headers]]
  for = "/meal-planner/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
